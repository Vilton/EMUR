<ng-container *ngVar="(communitiesRD$ | async) as communitiesRD">
  <div *ngIf="communitiesRD?.hasSucceeded" class="emur-themes">

    <h2 class="emur-themes-title">
      {{'home.top-level-communities.head' | translate}}
    </h2>

    <div class="emur-themes-grid">
      <div class="emur-theme" *ngFor="let comunidade of communitiesRD.payload.page">
        <a [href]="'communities/' + comunidade.uuid" class="emur-theme-link">
          <img [src]="comunidade.logo"
            onerror="this.onerror=null;this.src='/assets/dspace/images/emur/naoDisponivel.svg'" class="emur-theme-image" alt="" loading="lazy">
          <p class="emur-theme-name">{{comunidade.name}}</p>
        </a>
      </div>
    </div>

  </div>
  <ds-error *ngIf="communitiesRD?.hasFailed " message="{{'error.top-level-communities' | translate}}"></ds-error>
  <ds-loading *ngIf="communitiesRD?.isLoading " message="{{'loading.top-level-communities' | translate}}"></ds-loading>
</ng-container>
