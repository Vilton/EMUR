<div class="carousel-container" #carouselContainer>
  <!-- Logo and menu stacked in the bottom-left corner -->
  <div class="carousel-aside">
    <div class="logo-overlay">
      <img src="assets/dspace/images/emur/LOGO_EMUR0.webp"
        alt="Digidata - Repositório Digital da Memória Urbanística do Recife" class="logo-image">
    </div>

    <!-- Ajuste os destinos conforme as rotas cadastradas no projeto. -->
    <nav class="carousel-menu" aria-label="Menu principal">
      <!-- <a routerLink="/home">{{ 'home.title' | translate }}</a> -->
      <a routerLink="/community-list">{{ 'menu.section.browse_global_communities_and_collections' | translate }}</a>
      <a routerLink="/statistics">{{ 'menu.section.statistics' | translate }}</a>
      <a routerLink="/contact">{{ 'menu.section.contact' | translate }}</a>
      <div class="carousel-submenu-group" [class.open]="aboutOpen"
        (mouseenter)="setAboutOpen(true)" (mouseleave)="setAboutOpen(false)"
        (focusout)="onAboutFocusOut($event)" (keydown.escape)="setAboutOpen(false)">
        <button type="button" class="carousel-submenu-toggle" aria-haspopup="true"
          aria-controls="carousel-about-submenu" [attr.aria-expanded]="aboutOpen"
          (click)="setAboutOpen(!aboutOpen)">
          {{ 'menu.section.about' | translate }}
          <i class="fas fa-caret-down" aria-hidden="true"></i>
        </button>
        <div id="carousel-about-submenu" class="carousel-submenu">
          <a routerLink="/about/urb">{{ 'menu.section.about.urb' | translate }}</a>
          <a routerLink="/about/emur">{{ 'menu.section.about.emur' | translate }}</a>
        </div>
      </div>
    </nav>
  </div>

  <div class="carousel-wrapper">
    <div class="carousel-slide" *ngFor="let slide of slides; let i = index; trackBy: trackBySlide"
      [class.active]="i === currentSlide" [class.exiting]="i === previousSlide"
      [ngClass]="i === currentSlide ? 'animation-' + currentAnimation : ''" [attr.aria-hidden]="i !== currentSlide">
      <img [src]="slide.image" [alt]="slide.title" loading="lazy">
      <div class="slide-content">
        <h4>{{ slide.title }}</h4>
      </div>
    </div>
  </div>

  <button type="button" class="carousel-btn prev" (click)="prev()" aria-label="Imagem anterior">‹</button>
  <button type="button" class="carousel-btn next" (click)="next()" aria-label="Próxima imagem">›</button>
  <button type="button" class="carousel-btn play-pause" (click)="togglePlay()"
    [attr.aria-label]="isPlaying ? 'Pausar carrossel' : 'Reproduzir carrossel'">
    {{ isPlaying ? '❚❚' : '▶' }}
  </button>
</div>
