<ng-container *ngVar="(itemRD$ | async) as itemRD">
  <section class="recent-items py-4" [ngClass]="placeholderFontClass"
           *ngIf="itemRD?.hasSucceeded && itemRD?.payload?.page.length > 0" @fadeIn>

    <h2 class="recent-items__heading">{{ 'home.recent-submissions.head' | translate }}</h2>

    <div class="recent-items__grid">
      <a class="recent-item-card"
         *ngFor="let item of itemRD?.payload?.page; trackBy: trackById"
         [routerLink]="itemRoute(item)">
        <span class="recent-item-card__title">{{ itemTitle(item) }}</span>
        <span class="recent-item-card__date" *ngIf="itemDate(item)">({{ itemDate(item) }})</span>
        <span class="recent-item-card__abstract" *ngIf="itemAbstract(item)">{{ itemAbstract(item) }}</span>
      </a>
    </div>

    <div class="recent-items__more">
      <button type="button" (click)="onLoadMore()" class="btn btn-primary search-button">
        {{ 'vocabulary-treeview.load-more' | translate }} ...
      </button>
    </div>
  </section>

  <ds-error *ngIf="itemRD?.hasFailed" message="{{ 'error.recent-submissions' | translate }}"></ds-error>
  <ds-loading *ngIf="!itemRD || itemRD.isLoading" message="{{ 'loading.recent-submissions' | translate }}"></ds-loading>
</ng-container>
