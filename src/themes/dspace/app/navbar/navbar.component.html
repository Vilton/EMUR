<ng-container *ngIf="(isMobile$ | async) && (isAuthenticated$ | async)">
  <ds-user-menu [inExpandableNavbar]="true"></ds-user-menu>
</ng-container>
<div *ngIf="sections | async as menuSections" class="navbar-nav emur-menu" role="menubar"
  id="main-site-navigation"
  [ngClass]="(isMobile$ | async) ? 'navbar-nav-mobile' : 'navbar-nav-desktop'">
  <a *ngIf="!hasMenuLink(menuSections, 'home')" class="ds-menu-item emur-home-link"
    routerLink="/home" role="menuitem">{{ 'home.title' | translate }}</a>

  <div *ngFor="let section of menuSections" class="emur-menu-section"
    [style.order]="menuOrder(section)">
    <ng-container
      *ngComponentOutlet="(sectionMap$ | async).get(section.id)?.component; injector: (sectionMap$ | async).get(section.id)?.injector;">
    </ng-container>
  </div>

  <a *ngIf="!hasMenuLink(menuSections, 'contact')" class="ds-menu-item emur-contact-link"
    routerLink="/contact" role="menuitem">{{ 'menu.section.contact' | translate }}</a>
</div>
