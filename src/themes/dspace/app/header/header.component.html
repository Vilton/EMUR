<header id="main-site-header">
  <div id="main-site-header-container" class="container">
    <a class="emur-brand" routerLink="/home" [attr.aria-label]="'home.title' | translate">
      <img id="header-logo" src="assets/dspace/images/emur/logo_arvore.svg"
        [attr.alt]="'menu.header.image.logo' | translate" />
    </a>

    <nav *ngIf="(isMobile$ | async) !== true" id="desktop-navbar"
      [attr.aria-label]="'nav.main.description' | translate">
      <ds-navbar></ds-navbar>
    </nav>

    <div id="header-right">
      <form class="emur-navbar-search" role="search" [attr.aria-label]="'nav.search' | translate"
        (submit)="submitNavbarSearch($event, navbarQuery.value)">
        <button type="submit" [attr.aria-label]="'nav.search.button' | translate">
          <i class="fas fa-search" aria-hidden="true"></i>
        </button>
        <input #navbarQuery type="search" name="query" autocomplete="on" [attr.aria-label]="'nav.search' | translate"
          [placeholder]="'home.search-form.placeholder' | translate" />
      </form>

      <div class="emur-navbar-actions" role="toolbar">
        <ds-context-help-toggle></ds-context-help-toggle>
        <ds-impersonate-navbar></ds-impersonate-navbar>
        <ds-auth-nav-menu></ds-auth-nav-menu>
        <ds-lang-switch></ds-lang-switch>
      </div>

      <button *ngIf="isMobile$ | async" id="navbar-toggler" type="button" (click)="toggleNavbar()"
        [attr.aria-label]="'nav.toggle' | translate" aria-controls="collapsible-mobile-navbar"
        [attr.aria-expanded]="(isNavBarCollapsed$ | async) !== true">
        <span class="fas fa-bars" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
